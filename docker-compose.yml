services:
  db:
    image: mariadb:11
    command: --skip-name-resolve=0
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: "mariadb -uroot -p$MARIADB_ROOT_PASSWORD $MARIADB_DATABASE -e 'SHOW DATABASES;'"
      interval: 5s
      retries: 5

  wiki:
    build:
      context: .
      args:
        INSTALL_API: "false"
        INSTALL_GCSFUSE: "false"
        INSTALL_XDEBUG: "${INSTALL_XDEBUG:-false}"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      #Skins
      - ./skins/GiantBomb:/var/www/html/skins/GiantBomb
      - ./config/LocalSettings.php:/var/www/html/LocalSettings.php
      - ./config:/config
      - ./data:/data/
      - wiki-data:/var/www/html/images
    environment:
      - MV_ENV=dev
      - PHP_IDE_CONFIG=serverName=mediawiki
    restart: unless-stopped

volumes:
  db-data:
  wiki-data: {}
